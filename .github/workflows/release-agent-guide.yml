name: Release Agent Guide pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack Agent Guide zip
        env:
          MCPX_PACK_VERSION: ${{ github.ref_name }}
        run: npm run pack:agent-guide

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-agent-guide/mcpx-agent-guide-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
